<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>戦国IXA 火力シミュレーター</title>
    <style>
        body { font-family: sans-serif; background-color: #f4f5f7; padding: 20px; color: #333; }
        .container { max-width: 950px; margin: 0 auto; background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .header-area { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #333; padding-bottom: 10px; margin-bottom: 20px; }
        h1 { font-size: 1.5em; margin: 0; }
        
        .save-load-area { background: #e0f7fa; padding: 15px; border-radius: 5px; border: 1px solid #b2ebf2; margin-bottom: 25px; display: flex; align-items: center; gap: 15px; flex-wrap: wrap; }
        .save-load-area select { padding: 8px; font-size: 1em; min-width: 200px; }
        
        .section { margin-bottom: 25px; padding: 15px; border: 1px solid #e0e0e0; border-radius: 5px; background: #fafafa; }
        
        table { width: 100%; border-collapse: collapse; margin-bottom: 15px; background: #fff; }
        th, td { border: 1px solid #ccc; padding: 8px; text-align: center; }
        th { background-color: #eeeeee; font-size: 0.9em; }
        input[type="number"], input[type="text"], select { padding: 6px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        
        .btn { padding: 8px 12px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .btn-calc { background-color: #ff9800; color: white; margin-bottom: 10px; }
        .btn-add { background-color: #4caf50; color: white; margin-top: 10px;}
        .btn-delete { background-color: #f44336; color: white; padding: 6px 10px; }
        .btn-run { background-color: #1976d2; color: white; width: 100%; font-size: 1.2em; padding: 15px; margin-top: 10px; }
        .btn-save { background-color: #607d8b; color: white; }
        .btn-load { background-color: #8d6e63; color: white; }
        .btn-del-data { background-color: #e57373; color: white; }
        
        .result-box { margin-top: 20px; padding: 20px; background: #fff3e0; border: 1px solid #ffcc80; border-radius: 5px; text-align: center; }
        .result-value { font-size: 1.5em; font-weight: bold; color: #d32f2f; }
        .total-power-row { font-size: 1.2em; font-weight: bold; background: #e3f2fd; padding: 10px; border-radius: 5px; display: inline-block;}
        
        .box-cmd { background: #e8f5e9; padding: 15px; border-radius: 5px; margin-bottom: 10px; border: 1px solid #c8e6c9; }
        .box-mane { background: #fff3e0; padding: 15px; border-radius: 5px; border: 1px solid #ffe0b2; }
        .box-buff { background: #fce4ec; padding: 15px; border-radius: 5px; border: 1px solid #f8bbd0; margin-bottom: 15px;}
        
        .skill-row { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; flex-wrap: wrap; background: #fff; padding: 10px; border: 1px solid #ddd; border-radius: 4px;}
        .takuetsu-group { background: #fce4ec; padding: 5px 10px; border-radius: 4px; border: 1px dashed #f48fb1; display: inline-flex; align-items: center; gap: 8px;}
        h4 { margin-top: 0; margin-bottom: 10px; }
        .header-sub { font-size: 0.8em; color: #666; margin-left: 10px; font-weight: normal;}
    </style>
</head>
<body onload="initApp()">
    <div class="container">
        <div class="header-area">
            <h1>戦国IXA 火力シミュレーター (Ver 0.7)</h1>
        </div>

        <!-- データ管理エリア -->
        <div class="save-load-area">
            <div>
                <input type="text" id="saveName" placeholder="部隊名 (例: 今川マネ部隊)" style="width: 200px; padding: 8px;">
                <button class="btn btn-save" onclick="saveData()">💾 名前を付けて保存</button>
            </div>
            <div style="border-left: 2px solid #b2ebf2; height: 30px; margin: 0 10px;"></div>
            <div>
                <select id="savedList">
                    <option value="">-- 保存された部隊を選ぶ --</option>
                </select>
                <button class="btn btn-load" onclick="loadData()">📂 読込</button>
                <button class="btn btn-del-data" onclick="deleteData()">🗑 削除</button>
            </div>
        </div>
        
        <!-- 1. 素攻計算セクション -->
        <div class="section">
            <h3>1. 部隊素攻の計算</h3>
            <table>
                <tr>
                    <th></th><th>武将攻撃力</th><th>兵数</th><th>兵士攻撃力</th><th>統率</th>
                </tr>
                <script>
                    const ranks = [
                        {name: 'XXX', val: 1.3}, {name: 'XX', val: 1.25}, {name: 'X', val: 1.2},
                        {name: 'SSS', val: 1.15}, {name: 'SS', val: 1.1}, {name: 'S', val: 1.05},
                        {name: 'A', val: 1.0}, {name: 'B', val: 0.95}, {name: 'C', val: 0.9}
                    ];
                    let optionsHTML = ranks.map(r => `<option value="${r.val}">${r.name} (${r.val})</option>`).join('');
                    for(let i=1; i<=4; i++) {
                        document.write(`
                            <tr>
                                <td>武将${i}</td>
                                <td><input type="number" id="atk${i}" value="0" style="width: 100px;"></td>
                                <td><input type="number" id="troops${i}" value="0" style="width: 80px;"></td>
                                <td><input type="number" id="soldierAtk${i}" value="25" style="width: 80px;"></td>
                                <td><select id="command${i}">${optionsHTML}</select></td>
                            </tr>
                        `);
                    }
                </script>
            </table>
            <button class="btn btn-calc" onclick="calculateBasePower()">🔄 入力値から素攻を計算</button><br>
            <div class="total-power-row">
                最終的な部隊素攻: <input type="number" id="basePower" value="1000000" style="width: 150px; font-size: 1.1em; font-weight:bold;">
            </div>
        </div>

        <!-- 2. 部隊バフ設定 -->
        <div class="section box-buff">
            <h3>2. 部隊全体のバフ設定</h3>
            <label style="font-weight: bold;">✨ 卓越確率アップの合計値: + <input type="number" id="globalTakBuff" value="15" style="width: 80px;"> %</label>
        </div>

        <!-- 3. 模倣（マネ）セクション -->
        <div class="section">
            <h3>3. 模倣（マネ）設定</h3>
            
            <div class="box-cmd">
                <h4>👑 部隊長スキル（模倣元）</h4>
                <div style="display: flex; gap: 8px; align-items: center; flex-wrap: wrap;">
                    <input type="text" id="cmdName" value="遠呂智ノ閃光" style="width: 130px;">
                    <label>発動: <input type="number" id="cmdRate" value="100" style="width: 60px;"> %</label>
                    <label>上昇: <input type="number" id="cmdEffect" value="120" style="width: 70px;"> %</label>
                    
                    <div class="takuetsu-group">
                        <label>卓越確率: <input type="number" id="cmdTakRate" value="30" style="width: 50px;"> %</label>
                        <label>卓越時上昇: <input type="number" id="cmdTakEffect" value="360" style="width: 70px;"> %</label>
                    </div>
                </div>
            </div>

            <div class="box-mane">
                <h4>👥 模倣スキルの数</h4>
                <label>マネ数: <input type="number" id="maneCount" value="12" style="width: 60px;"> 個</label>
                <label>平均発動率: <input type="number" id="maneRate" value="100" style="width: 60px;"> %</label>
            </div>
        </div>

        <!-- 4. その他の通常スキルセクション -->
        <div class="section">
            <h3>4. その他の通常スキル（初期スキル・バフ等）</h3>
            <div id="skillsArea">
                <div class="skill-row">
                    <input type="text" value="建御雷神ノ閃光" class="s-name" style="width: 130px;">
                    <label>発動: <input type="number" value="100" class="s-rate" style="width: 50px;"> %</label>
                    <label>上昇: <input type="number" value="320" class="s-effect" style="width: 60px;"> %</label>
                    <div class="takuetsu-group">
                        <label>卓越: <input type="number" value="0" class="s-tak-rate" style="width: 50px;"> %</label>
                        <label>卓越上昇: <input type="number" value="0" class="s-tak-effect" style="width: 60px;"> %</label>
                    </div>
                    <button class="btn btn-delete" onclick="this.parentElement.remove()">削除</button>
                </div>
            </div>
            <button class="btn btn-add" onclick="addSkill()">+ スキルを追加</button>
        </div>

        <button class="btn btn-run" onclick="runSimulation()">⚔️ 10,000回 シミュレーション実行</button>

        <div id="resultArea" class="result-box" style="display:none;">
            <h3>シミュレーション結果 (10,000回戦闘)</h3>
            <p>最大火力: <span class="result-value" id="resMax"></span></p>
            <p>最小火力: <span class="result-value" id="resMin"></span></p>
            <p>期待値 (平均): <span class="result-value" id="resAvg"></span></p>
        </div>
    </div>

    <script>
        // --- データ管理（複数保存）処理 ---
        const STORAGE_KEY = 'ixaSimulatorDataList';

        function initApp() {
            updateSavedList();
        }

        // 保存されているデータ一覧（オブジェクト）を取得
        function getSavedDataObj() {
            const rawData = localStorage.getItem(STORAGE_KEY);
            return rawData ? JSON.parse(rawData) : {};
        }

        // セレクトボックスのリストを更新
        function updateSavedList() {
            const dataObj = getSavedDataObj();
            const select = document.getElementById('savedList');
            select.innerHTML = '<option value="">-- 保存された部隊を選ぶ --</option>';
            
            for (const name in dataObj) {
                const option = document.createElement('option');
                option.value = name;
                option.textContent = name;
                select.appendChild(option);
            }
        }

        function saveData() {
            const name = document.getElementById('saveName').value.trim();
            if (!name) {
                alert('保存する部隊名を入力してください。');
                return;
            }

            const currentData = {
                bushou: [],
                basePower: document.getElementById('basePower').value,
                globalTakBuff: document.getElementById('globalTakBuff').value,
                cmd: {
                    name: document.getElementById('cmdName').value,
                    rate: document.getElementById('cmdRate').value,
                    effect: document.getElementById('cmdEffect').value,
                    takRate: document.getElementById('cmdTakRate').value,
                    takEffect: document.getElementById('cmdTakEffect').value
                },
                mane: {
                    count: document.getElementById('maneCount').value,
                    rate: document.getElementById('maneRate').value
                },
                skills: []
            };

            for(let i=1; i<=4; i++) {
                currentData.bushou.push({
                    atk: document.getElementById(`atk${i}`).value,
                    troops: document.getElementById(`troops${i}`).value,
                    soldierAtk: document.getElementById(`soldierAtk${i}`).value,
                    command: document.getElementById(`command${i}`).value
                });
            }

            document.querySelectorAll('.skill-row').forEach(row => {
                currentData.skills.push({
                    name: row.querySelector('.s-name').value,
                    rate: row.querySelector('.s-rate').value,
                    effect: row.querySelector('.s-effect').value,
                    takRate: row.querySelector('.s-tak-rate').value,
                    takEffect: row.querySelector('.s-tak-effect').value
                });
            });

            const dataObj = getSavedDataObj();
            dataObj[name] = currentData;
            localStorage.setItem(STORAGE_KEY, JSON.stringify(dataObj));
            
            updateSavedList();
            document.getElementById('savedList').value = name; // 保存したものを選択状態に
            alert(`「${name}」を保存しました！`);
        }

        function loadData() {
            const selectName = document.getElementById('savedList').value;
            if (!selectName) {
                alert('読み込む部隊を選んでください。');
                return;
            }

            const dataObj = getSavedDataObj();
            const data = dataObj[selectName];
            
            if(!data) {
                alert('データが見つかりません。');
                return;
            }
            
            // 画面にデータを反映
            document.getElementById('saveName').value = selectName; // 名前も復元

            if(data.bushou) {
                for(let i=1; i<=4; i++) {
                    if(data.bushou[i-1]) {
                        document.getElementById(`atk${i}`).value = data.bushou[i-1].atk;
                        document.getElementById(`troops${i}`).value = data.bushou[i-1].troops;
                        document.getElementById(`soldierAtk${i}`).value = data.bushou[i-1].soldierAtk;
                        document.getElementById(`command${i}`).value = data.bushou[i-1].command;
                    }
                }
            }

            if(data.basePower) document.getElementById('basePower').value = data.basePower;
            if(data.globalTakBuff) document.getElementById('globalTakBuff').value = data.globalTakBuff;
            
            if(data.cmd) {
                document.getElementById('cmdName').value = data.cmd.name;
                document.getElementById('cmdRate').value = data.cmd.rate;
                document.getElementById('cmdEffect').value = data.cmd.effect;
                document.getElementById('cmdTakRate').value = data.cmd.takRate;
                document.getElementById('cmdTakEffect').value = data.cmd.takEffect;
            }

            if(data.mane) {
                document.getElementById('maneCount').value = data.mane.count;
                document.getElementById('maneRate').value = data.mane.rate;
            }

            if(data.skills) {
                const skillsArea = document.getElementById('skillsArea');
                skillsArea.innerHTML = ''; 
                data.skills.forEach(skill => {
                    const div = document.createElement('div');
                    div.className = 'skill-row';
                    div.innerHTML = `
                        <input type="text" value="${skill.name}" class="s-name" style="width: 130px;">
                        <label>発動: <input type="number" value="${skill.rate}" class="s-rate" style="width: 50px;"> %</label>
                        <label>上昇: <input type="number" value="${skill.effect}" class="s-effect" style="width: 60px;"> %</label>
                        <div class="takuetsu-group">
                            <label>卓越: <input type="number" value="${skill.takRate}" class="s-tak-rate" style="width: 50px;"> %</label>
                            <label>卓越上昇: <input type="number" value="${skill.takEffect}" class="s-tak-effect" style="width: 60px;"> %</label>
                        </div>
                        <button class="btn btn-delete" onclick="this.parentElement.remove()">削除</button>
                    `;
                    skillsArea.appendChild(div);
                });
            }
            // 読み込み直後に素攻の再計算は行わず、保存されていた最終素攻をそのまま表示します。
        }

        function deleteData() {
            const selectName = document.getElementById('savedList').value;
            if (!selectName) {
                alert('削除する部隊を選んでください。');
                return;
            }

            if(confirm(`本当に「${selectName}」を削除しますか？`)) {
                const dataObj = getSavedDataObj();
                delete dataObj[selectName];
                localStorage.setItem(STORAGE_KEY, JSON.stringify(dataObj));
                updateSavedList();
                document.getElementById('saveName').value = '';
            }
        }

        // --- 以下は既存の計算・シミュレーション処理 ---
        function calculateBasePower() {
            let totalBasePower = 0;
            for (let i = 1; i <= 4; i++) {
                const atk = parseFloat(document.getElementById(`atk${i}`).value) || 0;
                const troops = parseFloat(document.getElementById(`troops${i}`).value) || 0;
                const soldierAtk = parseFloat(document.getElementById(`soldierAtk${i}`).value) || 0;
                const command = parseFloat(document.getElementById(`command${i}`).value) || 1.0;
                totalBasePower += (atk + (troops * soldierAtk)) * command;
            }
            document.getElementById('basePower').value = Math.floor(totalBasePower);
        }

        function addSkill() {
            const div = document.createElement('div');
            div.className = 'skill-row';
            div.innerHTML = `
                <input type="text" value="新規スキル" class="s-name" style="width: 130px;">
                <label>発動: <input type="number" value="100" class="s-rate" style="width: 50px;"> %</label>
                <label>上昇: <input type="number" value="100" class="s-effect" style="width: 60px;"> %</label>
                <div class="takuetsu-group">
                    <label>卓越: <input type="number" value="0" class="s-tak-rate" style="width: 50px;"> %</label>
                    <label>卓越上昇: <input type="number" value="0" class="s-tak-effect" style="width: 60px;"> %</label>
                </div>
                <button class="btn btn-delete" onclick="this.parentElement.remove()">削除</button>
            `;
            document.getElementById('skillsArea').appendChild(div);
        }

        function runSimulation() {
            const basePower = parseFloat(document.getElementById('basePower').value);
            if (isNaN(basePower) || basePower <= 0) {
                alert("正しい部隊素攻を入力してください。");
                return;
            }

            const globalTakBuff = (parseFloat(document.getElementById('globalTakBuff').value) || 0) / 100;
            const cmdRate = (parseFloat(document.getElementById('cmdRate').value) || 0) / 100;
            const cmdEffect = (parseFloat(document.getElementById('cmdEffect').value) || 0) / 100;
            const cmdTakRate = (parseFloat(document.getElementById('cmdTakRate').value) || 0) / 100;
            const cmdTakEffect = (parseFloat(document.getElementById('cmdTakEffect').value) || 0) / 100;
            const maneCount = parseInt(document.getElementById('maneCount').value) || 0;
            const maneRate = (parseFloat(document.getElementById('maneRate').value) || 0) / 100;

            const skillRows = document.querySelectorAll('.skill-row');
            const normalSkills = [];
            skillRows.forEach(row => {
                const rate = (parseFloat(row.querySelector('.s-rate').value) || 0) / 100;
                const effect = (parseFloat(row.querySelector('.s-effect').value) || 0) / 100;
                const takRate = (parseFloat(row.querySelector('.s-tak-rate').value) || 0) / 100;
                const takEffect = (parseFloat(row.querySelector('.s-tak-effect').value) || 0) / 100;
                normalSkills.push({ rate, effect, takRate, takEffect });
            });

            const iterations = 10000;
            let maxDmg = 0;
            let minDmg = Infinity;
            let sumDmg = 0;

            function getSkillEffect(isTriggered, effect, takRate, takEffect, buffRate) {
                if (!isTriggered) return 0; 
                if (takRate > 0 || takEffect > 0) {
                    const finalTakRate = takRate + buffRate;
                    if (Math.random() <= finalTakRate) {
                        return takEffect; 
                    }
                }
                return effect; 
            }

            for (let i = 0; i < iterations; i++) {
                let totalMultiplier = 1.0; 
                let cmdTriggered = Math.random() <= cmdRate;
                totalMultiplier += getSkillEffect(cmdTriggered, cmdEffect, cmdTakRate, cmdTakEffect, globalTakBuff);

                for (let m = 0; m < maneCount; m++) {
                    let maneTriggered = Math.random() <= maneRate;
                    totalMultiplier += getSkillEffect(maneTriggered, cmdEffect, cmdTakRate, cmdTakEffect, globalTakBuff);
                }

                for (let skill of normalSkills) {
                    let skillTriggered = Math.random() <= skill.rate;
                    totalMultiplier += getSkillEffect(skillTriggered, skill.effect, skill.takRate, skill.takEffect, globalTakBuff);
                }

                const finalDmg = basePower * totalMultiplier;
                
                if (finalDmg > maxDmg) maxDmg = finalDmg;
                if (finalDmg < minDmg) minDmg = finalDmg;
                sumDmg += finalDmg;
            }

            document.getElementById('resMax').innerText = Math.floor(maxDmg).toLocaleString();
            document.getElementById('resMin').innerText = Math.floor(minDmg).toLocaleString();
            document.getElementById('resAvg').innerText = Math.floor(sumDmg / iterations).toLocaleString();
            document.getElementById('resultArea').style.display = 'block';
        }
    </script>
</body>
</html>
